<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadir Efe Berk - Ders & Not Paneli</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .box { background: #fff; width: 100%; max-width: 480px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #1e293b; margin-top: 0; font-size: 20px; border-bottom: 2px solid #0284c7; padding-bottom: 8px; }
        .student-info { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .student-info p { margin: 4px 0; color: #475569; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #334155; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        button { width: 100%; background: #0284c7; color: #fff; border: none; padding: 11px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0369a1; }
        .result { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-weight: bold; text-align: center; }
        .pass { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .fail { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    </style>
</head>
<body>

<div class="box">
    <h2>Ders & Not Hesaplama Paneli</h2>
    
    <div class="student-info">
        <p><b>Öğrenci:</b> Kadir Efe Berk</p>
        <p><b>GitHub:</b> kadirefeberk / kadir</p>
        <p><b>Proje:</b> İnteraktif Not Hesaplama Sistemi</p>
    </div>

    <div class="input-group">
        <label>Vize Notu (%40):</label>
        <input type="number" id="vize" placeholder="Örn: 65" min="0" max="100">
    </div>

    <div class="input-group">
        <label>Final Notu (%60):</label>
        <input type="number" id="final" placeholder="Örn: 70" min="0" max="100">
    </div>

    <button onclick="hesapla()">Ortalama Hesapla</button>

    <div id="sonuc" class="result"></div>
</div>

<script>
    function hesapla() {
        const vize = parseFloat(document.getElementById('vize').value);
        const final = parseFloat(document.getElementById('final').value);
        const sonucDiv = document.getElementById('sonuc');

        if (isNaN(vize) || isNaN(final)) {
            alert("Lütfen geçerli notlar girin!");
            return;
        }

        const ortalama = (vize * 0.4) + (final * 0.6);
        sonucDiv.style.display = "block";

        if (ortalama >= 50) {
            sonucDiv.className = "result pass";
            sonucDiv.innerHTML = `Ortalama: ${ortalama.toFixed(1)} <br> Durum: GEÇTİ ✅`;
        } else {
            sonucDiv.className = "result fail";
            sonucDiv.innerHTML = `Ortalama: ${ortalama.toFixed(1)} <br> Durum: KALDI ❌`;
        }
    }
</script>

</body>
</html>
