<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınav Takip Asistanı</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .sinav-kart { background: #eef2f5; padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .kalan-gun { color: #007bff; } .bugun { color: #d9534f; } .gecti { color: #6c757d; }
        .motivasyon { margin-top: 20px; padding: 12px; background-color: #e3f2fd; border-left: 5px solid #2196f3; border-radius: 4px; font-style: italic; color: #0d47a1; }
    </style>
</head>
<body>
<div class="container">
    <h2>📌 Sınav Takip Asistanı</h2>
    <div id="sinav-listesi"></div>
    <div class="motivasyon" id="motivasyon-kutu"></div>
</div>
<script>
    const sinavlar = [
        { ders: "Matematik Sınavı", tarih: "2026-06-15" },
        { ders: "Fizik Sınavı", tarih: "2026-06-18" },
        { ders: "İngilizce Sınavı", tarih: "2026-06-22" }
    ];
    const motivasyonSozleri = [
        "Bugün yaptığın küçük fedakarlıklar, yarınki başarının temelidir!",
        "Çalışmak zor gelebilir ama başarmanın verdiği gurur her şeye değer.",
        "Pes etme! Son düzlüktesin, en iyisini yapabilirsin."
    ];
    const listeDiv = document.getElementById("sinav-listesi");
    const bugun = new Date(); bugun.setHours(0, 0, 0, 0);
    sinavlar.forEach(item => {
        const sinavTarihi = new Date(item.tarih);
        const kalanGun = Math.ceil((sinavTarihi - bugun) / (1000 * 60 * 60 * 24));
        const kart = document.createElement("div");
        kart.className = "sinav-kart";
        let durumText = kalanGun > 0 ? `<span class="kalan-gun">${kalanGun} gün kaldı</span>` : (kalanGun === 0 ? `<span class="bugun">🚨 BUGÜN!</span>` : `<span class="gecti">Geçti</span>`);
        kart.innerHTML = `<span>${item.ders}</span> ${durumText}`;
        listeDiv.appendChild(kart);
    });
    document.getElementById("motivasyon-kutu").innerText = `💡 "${motivasyonSozleri[Math.floor(Math.random() * motivasyonSozleri.length)]}"`;
</script>
</body>
</html>
